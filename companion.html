<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Little Reminder</title>
<link rel="stylesheet" href="companion.css">
</head>

<body>

<div id="companion" class="companion hidden">

  <!-- =========================
       WATER ATMOSPHERE
  ========================== -->

  <div class="water-glow"></div>

  <div class="water-ripple ripple1"></div>
  <div class="water-ripple ripple2"></div>
  <div class="water-ripple ripple3"></div>

  <div class="bubble b1"></div>
  <div class="bubble b2"></div>
  <div class="bubble b3"></div>
  <div class="bubble b4"></div>
  <div class="bubble b5"></div>
  <div class="bubble b6"></div>
  <div class="bubble b7"></div>


  <!-- =========================
       WATER MERMAID
  ========================== -->

  <div class="character">

    <div class="character-glow"></div>

    <div class="mermaid">
      <div class="mermaid-body">🧜‍♀️</div>
    </div>

  </div>


  <!-- WATER GLASS -->

  <div class="glass">
    🥛
  </div>


  <!-- =========================
       FOOD SCENE
  ========================== -->

  <div class="foodScene">

    <!-- warm background glow -->
    <div class="foodGlow"></div>

    <!-- floor shadow -->
    <div class="foodFloorShadow"></div>


    <!-- MOM -->
    <div class="foodMom">

      <!-- chef hat -->
      <div class="chefHat">

        <div class="hatPuff puff1"></div>
        <div class="hatPuff puff2"></div>
        <div class="hatPuff puff3"></div>

        <div class="hatBand"></div>

      </div>


      <!-- head -->
      <div class="momHead">

        <div class="momHair"></div>

        <div class="momFace">

          <div class="momEye eyeLeft"></div>
          <div class="momEye eyeRight"></div>

          <div class="momNose"></div>

          <div class="momSmile"></div>

        </div>

      </div>


      <!-- body / dress -->
      <div class="momBody">

        <div class="dressPattern pattern1"></div>
        <div class="dressPattern pattern2"></div>
        <div class="dressPattern pattern3"></div>

      </div>


      <!-- plate-carrying arm -->
      <div class="momArm plateArm">

        <div class="momHand"></div>

      </div>


      <!-- BELAN ARM -->
      <div class="momArm belanArm">

        <div class="momHand"></div>

      </div>


      <!-- BELAN -->
      <div class="belan">

        <div class="belanHandle"></div>

        <div class="belanBody"></div>

        <div class="belanEnd"></div>

      </div>


      <!-- PLATE -->
      <div class="foodPlate">

        <div class="foodRice"></div>
        <div class="foodCurry"></div>
        <div class="foodChapathi"></div>

        <!-- steam -->
        <div class="steam steam1"></div>
        <div class="steam steam2"></div>
        <div class="steam steam3"></div>

      </div>

    </div>


    <!-- FOOD SPEECH -->

    <div class="foodSpeech">
      Come eat! 🍲
    </div>

  </div>


  <!-- =========================
       WATER SPEECH
  ========================== -->

  <div class="speech">
    Time for Water 💧
  </div>


  <!-- =========================
       REMINDER CARD
  ========================== -->

  <div class="card">

    <div class="cardtop">

      <strong>Little Reminder</strong>

      <span>NOW</span>

    </div>


    <div class="message">
      Time for Water 💧
    </div>


    <div class="sub">
      Take a few sips and stay hydrated.
    </div>


    <div class="buttons">

      <button id="done">
        Drink Done
      </button>

      <button id="snooze">
        Snooze
      </button>

    </div>

  </div>

</div>


<script src="companion.js"></script>

</body>
</html>
