<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Little Reminder</title>
<link rel="stylesheet" href="companion.css">
</head>

<body>

<div id="companion" class="companion hidden">

  <!-- WATER ATMOSPHERE -->

  <div class="water-glow"></div>

  <div class="water-ripple ripple1"></div>
  <div class="water-ripple ripple2"></div>
  <div class="water-ripple ripple3"></div>

  <!-- WATER PARTICLES -->

  <div class="bubble b1"></div>
  <div class="bubble b2"></div>
  <div class="bubble b3"></div>
  <div class="bubble b4"></div>
  <div class="bubble b5"></div>
  <div class="bubble b6"></div>
  <div class="bubble b7"></div>

  <!-- MERMAID -->

  <div class="character">

    <div class="character-glow"></div>

    <div class="mermaid">
      <div class="mermaid-body">
        🧜‍♀️
      </div>
    </div>

  </div>

  <!-- GLASS -->

  <div class="glass">
    🥛
  </div>

  <!-- SPEECH -->

  <div class="speech">
    Time for Water 💧
  </div>

  <!-- REMINDER CARD -->

  <div class="card">

    <div class="cardtop">
      <strong>Little Reminder</strong>
      <span>NOW</span>
    </div>

    <div class="message">
      Time for Water 💧
    </div>

    <div class="sub">
      Take a few sips and stay hydrated.
    </div>

    <div class="buttons">
      <button id="done">
        Drink Done
      </button>

      <button id="snooze">
        Snooze
      </button>
    </div>

  </div>

</div>

<script src="companion.js"></script>

</body>
</html>
